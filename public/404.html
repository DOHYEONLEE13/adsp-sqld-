<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>페이지를 찾을 수 없습니다 | QuestDP</title>
    <meta
      name="description"
      content="QuestDP에서 요청한 페이지를 찾을 수 없습니다. 홈, ADsP, SQLD, 컴활 커리큘럼으로 이동할 수 있습니다."
    />
    <style>
      :root {
        color-scheme: dark;
        --base: #010828;
        --cream: #eff4ff;
        --muted: rgba(239, 244, 255, 0.74);
        --line: rgba(239, 244, 255, 0.16);
        --green: #7dd850;
        --orange: #fd802e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 82% 14%, rgba(125, 216, 80, 0.18), transparent 32rem),
          radial-gradient(circle at 12% 88%, rgba(253, 128, 46, 0.14), transparent 30rem),
          var(--base);
        color: var(--cream);
        font-family: "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 760px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 56px 20px;
        display: grid;
        align-content: center;
      }

      a {
        color: inherit;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--green);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 8vw, 64px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.75;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 30px;
      }

      nav a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(239, 244, 255, 0.06);
        text-decoration: none;
        font-size: 14px;
        font-weight: 850;
      }

      nav a:first-child {
        border-color: transparent;
        background: var(--orange);
        color: #010828;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 | QuestDP</p>
      <h1>찾는 페이지가 없어요.</h1>
      <p>
        주소가 바뀌었거나 아직 공개하지 않은 경로일 수 있습니다. 학습은 홈이나 커리큘럼에서 다시
        이어갈 수 있습니다.
      </p>
      <nav aria-label="주요 페이지">
        <a href="/">홈으로</a>
        <a href="/curriculum/adsp">ADsP 커리큘럼</a>
        <a href="/curriculum/sqld">SQLD 커리큘럼</a>
        <a href="/curriculum/comhwal">컴활 커리큘럼</a>
        <a href="/blog">공부법 블로그</a>
      </nav>
    </main>
  </body>
</html>
