<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>QuestDP 앱으로 이동 중</title>
    <meta
      name="description"
      content="QuestDP 앱 진입 경로를 최신 학습 화면으로 연결합니다."
    />
    <script>
      (function () {
        try {
          sessionStorage.setItem('questdp.appMode', '1');
        } catch (e) {}
        var hash = location.hash && location.hash !== '#' ? location.hash : '#/home';
        if (hash.replace(/\/$/, '') === '#/game') hash = '#/home';
        var params = new URLSearchParams(location.search);
        var version = params.get('v');
        var target = '/?app=1' + (version ? '&v=' + encodeURIComponent(version) : '') + hash;
        location.replace(target);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/?app=1#/home" />
  </head>
  <body>
    <p>
      QuestDP 앱으로 이동 중입니다.
      <a href="/?app=1#/home">홈 화면으로 이동</a>
    </p>
  </body>
</html>
