<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081642" />
    <script>
      (function () {
        try {
          var isAppPath = location.pathname === '/app' || location.pathname === '/app/';
          var isAppQuery = new URLSearchParams(location.search).get('app') === '1';
          var isAppSession = sessionStorage.getItem('questdp.appMode') === '1';
          if (isAppPath || isAppQuery || isAppSession) {
            document.documentElement.classList.add('questdp-app-mode');
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute('content', '#081642');
          }
        } catch (e) {}
      })();
    </script>
    <title>QuestDP — ADsP·SQLD·컴활 자격증 학습사이트 | 게임형 문제풀이</title>
    <meta

      content="QuestDP는 ADsP·SQLD·컴활 자격증을 게임처럼 공부하는 학습사이트입니다. 로드맵과 퀘스트를 따라 개념을 익히고, 문제풀이와 약점 복습으로 시험을 준비하세요."
    />
    <!-- Author / Publisher — Google E-E-A-T 신호 + 검색 결과 표시. -->
    <meta name="author" content="QuestDP" />
    <meta name="publisher" content="퀘스트디피" />
    <!-- 한국 시장 명시 — 네이버·다음 봇 시그널. -->
    <meta name="geo.region" content="KR" />
    <meta name="geo.placename" content="대한민국" />
    <!-- 모바일 앱 카드 — iOS Safari 가 PWA-style 표시. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuestDP" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Open Graph (Facebook · KakaoTalk · LinkedIn share preview) -->
    <meta property="og:title" content="QuestDP — ADsP·SQLD·컴활 자격증 학습사이트 | 게임형 문제풀이" />
    <meta
      property="og:description"

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QuestDP — ADsP·SQLD·컴활 자격증 학습사이트 대표 이미지." />
    <link rel="image_src" href="https://quest-dp.com/og/questdp-home.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QuestDP — ADsP·SQLD·컴활 자격증 학습사이트 | 게임형 문제풀이" />
    <meta
      name="twitter:description"
      content="로드맵과 퀘스트를 따라 ADsP·SQLD·컴활 개념, 문제풀이, 약점 복습으로 시험을 준비하세요."

    <!-- Canonical (SPA — 라우트별 갱신은 react-helmet-async 가 처리) -->
    <link rel="canonical" href="https://quest-dp.com/" />

    <!-- Search engine 검증 메타 — Naver Search Advisor 도메인 소유 인증. -->
    <meta name="naver-site-verification" content="07a09e062717500f2dbb55614dac767c32ef64fc" />
    <!--
      Google Search Console: **도메인(DNS) 방식으로 이미 인증됨** (2026-05 이전).
      도메인 인증은 모든 서브도메인·프로토콜 자동 커버 → meta 태그 불필요.
      향후 다른 Google 계정으로 추가 인증 필요 시에만 아래 주석 해제 + 토큰 paste.
    -->
    <!-- <meta name="google-site-verification" content="TOKEN_HERE" /> -->

    <!-- JSON-LD: Organization + WebSite (Schema.org)
         검색엔진이 QuestDP 의 정체와 사이트 검색 동작을 이해 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "QuestDP",
        "alternateName": "퀘스트디피",
        "url": "https://quest-dp.com",
        "logo": "https://quest-dp.com/logo/questdp-mark.png",
        "image": "https://quest-dp.com/logo/questdp-lockup.png",
        "description": "ADsP·SQLD·컴활 자격증을 게임처럼 공부하는 학습사이트. 로드맵과 퀘스트를 따라 개념을 익히고 문제풀이와 약점 복습으로 시험을 준비합니다.",
        "knowsAbout": ["ADsP 학습", "SQLD 학습", "컴활 학습", "컴퓨터활용능력 필기", "게임형 학습", "약점 복습", "Leitner SRS", "망각곡선 복습"],
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "KR",
          "addressLocality": "성남시"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "questdpofficial@gmail.com",
          "contactType": "customer support",
          "areaServed": "KR",
          "availableLanguage": ["Korean"]
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "QuestDP",
        "alternateName": ["퀘스트디피"],
        "url": "https://quest-dp.com",
        "inLanguage": "ko-KR",
        "publisher": {
          "@type": "Organization",
          "name": "QuestDP"
        }
      }
    </script>

    <!-- Favicons — 토리 마스코트 마크 (questdp-mark.png).
         Google 검색 결과 옆에 favicon 노출되도록 다중 sizes 등록.
         (Google 권장 — 48 의 배수 사이즈, sizes 명시)
         2026-05-10: SVG favicon 폐기. 브라우저 보안 정책상 favicon SVG 가 외부
         PNG 를 embed 못 함 (검정 배경만 렌더됨). PNG 만으로 단순화. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/questdp-mark.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo/questdp-mark.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo/questdp-mark.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo/questdp-mark.png" />
    <!-- legacy 'shortcut icon' — 일부 검색엔진은 이걸 우선 -->
    <link rel="shortcut icon" type="image/png" href="/logo/questdp-mark.png" />
    <!-- iOS 홈 화면 아이콘 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/questdp-mark.png" />
    <!-- PWA / Android 홈 화면 — manifest.json 이 추가 메타 + 다중 사이즈 정의 -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate" type="application/rss+xml" title="QuestDP 공부법 RSS" href="/rss.xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Noto Sans KR 은 본문/제목 기본 글꼴이므로 우선 로드. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- Sora 와 장식 폰트는 FOUT 허용 비차단 로드. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Condiment&family=Gaegu:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

        href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&display=swap"
